[app]
timezone = "Asia/Bangkok"
db_path = "data/habits.db"
log_level = "INFO"

[telegram]
poll_timeout = 30
backoff_initial_seconds = 1
backoff_max_seconds = 60

[ollama]
base_url = "http://mac-mini:11434"
model = "qwen3.5:9b-mlx"
models = ["qwen3.5:9b-mlx", "qwen3:8b"]
timeout_seconds = 30
confidence_threshold = 0.55
retry_attempts = 2
retry_backoff_seconds = 1.5

[reminders.water]
times = ["08:00", "10:30", "13:00", "15:30", "18:00", "20:30"]
goal_ml = 2500

[reminders.stretch]
times = ["11:00", "16:00"]

[reminders.diary]
times = ["21:30"]

[units]
glass_ml = 250
bottle_ml = 600

[weekly_review]
day_of_week = "sun"
time = "20:00"

[backup]
dir = "data/backups"
retain = 14

[health]
interval_seconds = 60

[i18n]
language = "auto"
primary_language = "th"

# ROADMAP.md v0.9.0 "Adaptive Reminders, Snooze & Quiet Hours": empty by
# default (opt-in -- AC9.2's own resolution: no silent behavior change).
# Each window is [start, end] "HH:MM" (24h, [app].timezone); an end before
# start crosses midnight, e.g. ["23:00", "07:00"]. Example (commented out):
# windows = [["13:00", "14:00"], ["23:00", "07:00"]]
[quiet_hours]
windows = []

[snooze]
default_minutes = 30

# ROADMAP.md v0.7.0 "Multi-Habit Extensibility": `[[habits]]` is now the
# source of truth for water/stretch/diary (config.py's `Config.habits`
# default reproduces this exact shape when this file/section is absent).
# The legacy `[reminders.*]`/`[units]` sections above are retained but
# ignored by the new habit-driven code paths.
[[habits]]
id = "water"
type = "numeric"
goal = 2500
reminder_times = ["08:00", "10:30", "13:00", "15:30", "18:00", "20:30"]
label = { en = "water", th = "น้ำ" }
unit  = { en = "ml",    th = "มล." }
# ROADMAP.md v0.9.0: default true (skip this habit's reminder once the
# day's goal is met); set false to always send it regardless of goal state.
skip_if_goal_met = true
[habits.unit_aliases]
glass = 250
"แก้ว" = 250
bottle = 600
"ขวด" = 600

[[habits]]
id = "stretch"
type = "duration"
reminder_times = ["11:00", "16:00"]
label = { en = "stretch", th = "ยืดเส้น" }
unit  = { en = "min",     th = "นาที" }

[[habits]]
id = "diary"
type = "text"
reminder_times = ["21:30"]
label = { en = "diary", th = "ไดอารี่" }

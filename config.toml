# SPEC-v1.2.md "Multi-user support": this bot now serves multiple people
# from one process, partitioned by Telegram chat id. The OWNER is whoever
# TELEGRAM_CHAT_ID (in .env) names -- their pre-v1.2 data is automatically
# attributed to them on first startup after upgrading, and their own
# experience is unchanged (undo/targets/streaks/reminders/summaries/
# reviews all work exactly as before). Anyone else who messages the bot is
# held as "pending" until the owner sends `/approve <their chat id>` (or
# `/block <chat id>` to refuse); `/users` lists everyone's role/status.
# Once approved, a person gets their own fully independent logs, streaks,
# targets, undo, and preferences:
#   /lang en | th | auto           -- per-person reply language (default: auto)
#   /quiet HH:MM-HH:MM[,...] | off -- per-person quiet hours (default: inherit [quiet_hours] below)
#   /remind <habit> HH:MM [HH:MM ...] | off | default
#                                   -- per-person reminder times for one habit
#                                      (default: inherit that habit's reminder_times below)
# The habit catalog itself ([[habits]] below) stays global -- everyone
# tracks the same habits; only targets/reminder-times/preferences differ
# per person. Health/connectivity alerts still go to the owner only.
[app]
timezone = "Asia/Bangkok"
db_path = "data/habits.db"
log_level = "INFO"

[telegram]
poll_timeout = 30
backoff_initial_seconds = 1
backoff_max_seconds = 60

[ollama]
base_url = "http://mac-mini:11434"
model = "qwen3.5:9b-mlx"
models = ["qwen3.5:9b-mlx", "qwen3:8b"]
timeout_seconds = 30
confidence_threshold = 0.55
retry_attempts = 2
retry_backoff_seconds = 1.5
# SPEC-v1.5.md R-L4: gates the once-per-model startup schema probe. true
# (default, unchanged behavior) runs it at startup; false skips it for
# whoever wants to save the round trip.
probe_on_startup = true

[reminders.water]
times = ["08:00", "10:30", "13:00", "15:30", "18:00", "20:30"]
goal_ml = 2500

[reminders.stretch]
times = ["11:00", "16:00"]

[reminders.diary]
times = ["21:30"]

[units]
glass_ml = 250
bottle_ml = 600

[weekly_review]
day_of_week = "sun"
time = "20:00"

[backup]
dir = "data/backups"
retain = 14

# SPEC-v1.5.md R-L3: liveness ping only (/api/version + Telegram getMe),
# not an inference call. The code default is now 300s (v1.5.0, raised
# from 60s -- fewer dependency pings, blunted by the deterministic
# pre-parser keeping most messages off Ollama during an outage). This
# deployment keeps its existing pinned value below (AC-17: a shorter
# pinned value still works, incl. DOWN->UP recovery within the interval).
[health]
interval_seconds = 60

[i18n]
language = "auto"
primary_language = "th"

# ROADMAP.md v0.9.0 "Adaptive Reminders, Snooze & Quiet Hours": empty by
# default (opt-in -- AC9.2's own resolution: no silent behavior change).
# Each window is [start, end] "HH:MM" (24h, [app].timezone); an end before
# start crosses midnight, e.g. ["23:00", "07:00"]. Example (commented out):
# windows = [["13:00", "14:00"], ["23:00", "07:00"]]
[quiet_hours]
windows = []

[snooze]
default_minutes = 30

# SPEC-v1.5.md "Hourly check-ins" (R-K2), OQ1 RESOLVED (b): opt-in for
# everyone -- off by default, including the owner. `window` is the
# default hourly window applied when a user runs `/checkin on` without
# specifying their own; `/checkin HH:MM-HH:MM` overrides it per-user
# (stored in `users.checkin_window`), `/checkin off` disables again.
[checkin]
enabled = false
window = "08:00-20:00"

# SPEC-v1.6.md "Almost there" end-of-day nudge (R-N1-R-N3), OQ2 RESOLVED:
# rides check-in enablement -- a user only gets a nudge if they've also
# run `/checkin on` (no separate toggle). `threshold_pct` = how close
# (percent of goal) counts as "close enough to nudge"; `time` = the one
# fixed minute/day the nudge tick fires at.
[nudge]
threshold_pct = 80
time = "20:00"

# ROADMAP.md v0.10.0 "Streaks, Gentle Gamification & Daily Summary".
# `enabled` gates only the milestone encouragement line appended to a
# confirmation when a streak crosses one of `milestones`; streak
# computation itself (e.g. the weekly review's duration streak) is always
# on. `daily_summary`/`daily_summary_time` are independent of `enabled` --
# the end-of-day recap can be turned off without touching milestone lines,
# and vice versa (AC10.4 "no behavioral leakage").
[gamification]
enabled = true
milestones = [3, 7, 30]
daily_summary = true
daily_summary_time = "21:45"

# ROADMAP.md v1.0.0 "Insights: Charts-as-Images". `enabled = true` renders a
# chart PNG per chartable habit (numeric-with-goal -> bars vs. a goal line;
# duration/boolean -> count bars; text habits have nothing to chart) and
# attaches them to the weekly review, IF matplotlib is installed
# (`pip install -e ".[charts]"`). Missing matplotlib is never an error --
# the review falls back to text-only and logs once.
[charts]
enabled = true

# ROADMAP.md v1.0.0 Garmin hydration import. Empty csv_path (default) means
# the feature is off -- no Garmin section is added to the weekly review.
# Point csv_path at a local Garmin hydration CSV export to turn it on;
# column_map maps this app's field names to that file's header names (export
# format varies by locale/device). A missing/malformed file at review time
# doesn't fail the review -- it notes "Garmin data unavailable" instead.
[garmin]
csv_path = ""
discrepancy_threshold_ml = 300
[garmin.column_map]
date = "Date"
hydration_ml = "Hydration(ml)"

# SPEC-v1.3.md "Audit log": every state-changing action (undo/edit,
# target/remind/lang/quiet set, admin approve/block/pending) writes one
# durable audit_log row (who, when, what, old -> new, how). The owner
# reads it in chat with /audit (owner-only, hidden from the command
# menu). retention_days controls how long rows are kept -- pruned once at
# process startup, not per-insert; 0 means keep forever, never prune.
# This section is commented out because 365 is already config.py's own
# default (AuditConfig.retention_days) -- present here only as living
# documentation of the knob, same convention as every other section
# above. Uncomment + edit to change it.
# [audit]
# retention_days = 365

# ROADMAP.md v0.7.0 "Multi-Habit Extensibility": `[[habits]]` is now the
# source of truth for water/stretch/diary (config.py's `Config.habits`
# default reproduces this exact shape when this file/section is absent).
# The legacy `[reminders.*]`/`[units]` sections above are retained but
# ignored by the new habit-driven code paths.
#
# SPEC-v1.1.md "Undo menu + per-habit targets": each `goal` below (and the
# legacy `[reminders.water].goal_ml` above, for `water` specifically) is
# only the DEFAULT daily goal. Sending `/target <habit> <value>` in chat
# stores a per-habit override in the DB (`habit_targets` table, migration
# 005) that takes priority over the value here at runtime, for every
# reminder/streak/summary/review/chart/confirmation -- no restart, no
# config edit needed. `/target <habit> default` clears the override and
# reverts to whatever is configured here. No new field is needed in this
# file for that -- the override lives entirely in the DB.
[[habits]]
id = "water"
type = "numeric"
goal = 2500
reminder_times = ["08:00", "10:30", "13:00", "15:30", "18:00", "20:30"]
label = { en = "water", th = "น้ำ" }
unit  = { en = "ml",    th = "มล." }
# ROADMAP.md v0.9.0: default true (skip this habit's reminder once the
# day's goal is met); set false to always send it regardless of goal state.
skip_if_goal_met = true
[habits.unit_aliases]
glass = 250
"แก้ว" = 250
bottle = 600
"ขวด" = 600

[[habits]]
id = "stretch"
type = "duration"
reminder_times = ["11:00", "16:00"]
label = { en = "stretch", th = "ยืดเส้น" }
unit  = { en = "min",     th = "นาที" }

[[habits]]
id = "diary"
type = "text"
reminder_times = ["21:30"]
label = { en = "diary", th = "ไดอารี่" }

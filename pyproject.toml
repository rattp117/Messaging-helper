[project]
name = "habit-assistant"
version = "1.0.0+line"
description = "Local-first habit-tracking assistant (LINE Official Account edition, no-LLM, backed by a local Qwen model via Ollama on the Telegram edition)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tzdata>=2024.1",
    # SPEC-LINE.md §4 R-S8/§7: the one new runtime dependency this branch adds
    # -- LINE has no long-poll, so inbound needs a public HTTPS webhook and
    # images need an HTTPS media host, both requiring an HTTP *server* (httpx
    # is client-only). Pure-asyncio, runs its AppRunner inside the existing
    # event loop alongside APScheduler + the worker -- no thread bridging.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # SPEC-v1.10.md §4 R19 (module `riders`): parallel test execution.
    # Documented, NOT forced via [tool.pytest.ini_options] addopts (a
    # single-worker debug run needs no override; CI opts in explicitly) --
    # run with: pytest -n auto
    "pytest-xdist>=3.5",
]
# ROADMAP.md v1.0.0 "Insights: Charts-as-Images": the one new dependency in
# the whole roadmap, optional and gated behind [charts] enabled in
# config.toml. Install with: pip install -e ".[charts]"
charts = [
    "matplotlib>=3.8",
]

[project.scripts]
habit-assistant = "habit_assistant.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habit_assistant"]
# SPEC-v1.9.md §6 (font shared surface): assets/fonts/ lives at the repo
# root (mirrors config.toml's own placement), outside src/habit_assistant/
# -- `packages` above only picks up the package directory, so the bundled
# Noto Sans Thai TTF + its OFL.txt license need an explicit force-include
# to travel with a built wheel. `core/fonts.py` itself resolves the font
# path relative to the repo root at runtime (this project runs in-place
# from a checkout, not as an installed-elsewhere wheel -- same assumption
# `config.py:REPO_ROOT`/`DEFAULT_CONFIG_PATH` already make).
[tool.hatch.build.targets.wheel.force-include]
"assets/fonts" = "assets/fonts"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# SPEC-LINE.md §4 R-S7/§11 (shared surface): the LINE branch gate is
# `pytest -m "not telegram_only and not llm_only"` -- Telegram-transport
# tests (real channels/telegram.py wire behavior: HTTP request shapes,
# long-poll loop, callback_query handling -- none of it runs on LINE) and
# LLM-behavior tests (real llm/ollama_client.py extraction/classification --
# dead code on this branch's permanent no-LLM mode, R-B1-R-B9) are marked,
# not deleted, so they keep running unmodified on the Telegram/main branch.
markers = [
    "telegram_only: exercises channels/telegram.py's own wire behavior; not applicable on the LINE branch",
    "llm_only: exercises llm/ollama_client.py's real model-backed extraction/classification; dead code in no-LLM mode",
]
